<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Local Market Shopping Cart</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header class="header">
            <h1>Local Treats Shop</h1>
            <div class="cart-badge">🛒 Cart: <span id="cart-count">0</span> items</div>
        </header>

        <main class="container">
            <section class="products-section">
                <h2>Products</h2>
                <div id="product-list" class="grid"></div>
            </section>

            <section class="cart-section">
                <h2>Your Cart</h2>
                <div id="cart-items"></div>
                <div class="cart-summary">
                    <h3>Total: KES <span id="cart-total">0</span></h3>
                    <button id="clear-cart-btn" class="btn-danger">Clear Cart</button>
                </div>
            </section>
        </main>

        <script src="cart.js"></script>
    </body>
</html>
