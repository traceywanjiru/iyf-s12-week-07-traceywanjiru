<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 - Form Auto-Save</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Feedback Form</h1>
        <p class="subtitle">Your progress is automatically saved to localStorage every 5 seconds.</p>

        <form id="auto-save-form">
            <div class="form-group">
                <label for="username">Your Name</label>
                <input type="text" id="username" name="username" autocomplete="name" />
            </div>

            <div class="form-group">
                <label for="feedback">Your Feedback</label>
                <textarea id="feedback" name="feedback" rows="5"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="submit-btn">Submit Form</button>
                <span id="save-status" class="status-text">All changes saved</span>
            </div>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
