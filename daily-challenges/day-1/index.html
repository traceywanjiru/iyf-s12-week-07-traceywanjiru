<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 - Theme Persistence</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1>Theme Toggle Challenge</h1>
            <button id="theme-toggle" type="button">🌙 Dark Mode</button>
        </header>

        <main>
            <p>Click the button in the top right to switch between light and dark modes. Your preference will be saved in localStorage!</p>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
